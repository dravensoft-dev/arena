name: Arena portability

# Whether the tooling still runs on a machine that is not the one it was written on. A workflow
# of its own rather than a matrix over pr.yml, because five jobs across three operating systems
# at ten times the macOS minute rate is a cost nobody keeps paying, and a cost nobody keeps
# paying becomes a workflow somebody deletes. Running it on a merge request to main alone is
# what makes the price worth paying: the event is rare, and it is the one that matters, since
# main is what the two packages are published from.
#
# The cost of that choice, stated rather than discovered: work that lands on develop and stays
# there is never asked this question. The merge request is what asks it, and nothing before.
#
# The legs are declared in scripts/ci/arena/supported-os.ts, and check:portability holds this
# matrix equal to that list -- the names and the blocking flags both.

on:
  # One event, and no other way in. Not a schedule, not a push, and not a hand crank: a merge
  # request to main is the only thing that asks this question, so the answer is never one
  # somebody triggered to make a branch look ready. Seeing a leg before then means opening the
  # merge request, which is the point rather than the cost.
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: portability-${{ github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: 1.3.14

jobs:
  portable:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # A leg whose platform is not yet blocking reports and does not gate. The flag lives in
    # scripts/ci/arena/supported-os.ts with its reason, and check:portability holds this equal
    # to it, so a leg cannot quietly stop counting and a supported one cannot quietly stop
    # blocking. It flips to true when the platform is green, which is the whole definition.
    continue-on-error: ${{ !matrix.blocking }}
    strategy:
      # Every leg reports. A failure on one is a fact about that platform, and cancelling the
      # others would hide which platforms are fine, which is the whole question being asked.
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            blocking: true
          - os: macos-latest
            blocking: true
          - os: windows-latest
            blocking: false
    steps:
      - name: a path under %TEMP% outruns the 260-char budget before the tree does
        if: runner.os == 'Windows'
        run: git config --system core.longpaths true

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # core.autocrlf is deliberately left at the runner default. Overriding it would prove
      # .gitattributes works by not letting it be tested.

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-cache-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-cache-${{ runner.os }}-

      - name: install, which is the first thing a prebuilt native dependency can refuse
        run: bun install --frozen-lockfile

      - name: a browser, and CHROME_PATH is deliberately not exported
        uses: browser-actions/setup-chrome@v1

      - name: build every step
        run: bun run build

      - name: byte-identical to what the Linux tree committed
        run: git diff --exit-code

      - name: the tooling's own suites, where the injected-platform cases live
        run: bun run test:scripts

      - name: the gates whose answer can differ by platform
        run: bun scripts/ci/arena/run-portability.ts
