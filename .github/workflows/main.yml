name: Arena main

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: main
  cancel-in-progress: false

env:
  BUN_VERSION: 1.3.14
  # The one workflow that names a browser, so the terminal-override branch stays exercised.
  # pr.yml and develop.yml name none, which is what proves the candidate list finds one.
  CHROME_PATH: /usr/bin/google-chrome

jobs:
  verify:
    name: build and test everything
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-cache-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-cache-${{ runner.os }}-
      - run: bun install --frozen-lockfile

      - name: build and assemble, every step run
        run: bun run build:release

      - name: the build is idempotent, so a tracked file it rewrote is a generator out of step
        run: git diff --exit-code

      - name: every gate
        run: bun scripts/check/arena/check-all.ts --no-tests

      - name: the whole suite, counted per domain
        run: bun run ci:summarize
