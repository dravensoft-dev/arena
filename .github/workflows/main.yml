name: Arena main

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: main
  cancel-in-progress: false

jobs:
  verify:
    name: build and test everything
    uses: ./.github/workflows/verify.yml
    with:
      domains: core,react,angular,tailwind,arena
      # The one workflow that names a browser, the pinned one setup-chrome installs, so the
      # terminal-override branch stays exercised. pr.yml and develop.yml name none, which is what
      # proves the candidate list finds one.
      name-browser: true

  cache:
    name: the build the workflows after this one restore
    needs: [verify]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: the build verify made and every gate and suite passed over
        uses: actions/download-artifact@v8
        with:
          name: arena-build-${{ github.run_id }}

      # A re-run of this workflow reserves a key that already exists, which actions/cache/save
      # logs as a warning and does not fail on, so the second run keeps the first run's build.
      - name: the build every workflow that follows this one restores
        uses: actions/cache/save@v6
        with:
          path: |
            frameworks/**/*.generated.*
            frameworks/react/dist
            frameworks/angular/dist
            frameworks/angular/build
            dist/contracts
            dist/mcp
            dist/site
          key: arena-build-${{ runner.os }}-${{ github.sha }}
