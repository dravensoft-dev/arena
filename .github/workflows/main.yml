name: Arena main

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: main
  cancel-in-progress: false

env:
  BUN_VERSION: 1.3.14
  # The one workflow that names a browser, so the terminal-override branch stays exercised.
  # pr.yml and develop.yml name none, which is what proves the candidate list finds one.
  CHROME_PATH: /usr/bin/google-chrome

jobs:
  verify:
    name: build and test everything
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-cache-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-cache-${{ runner.os }}-
      - run: bun install --frozen-lockfile

      - name: build and assemble, every step run
        run: bun run build:release

      - name: the build is idempotent, so a tracked file it rewrote is a generator out of step
        run: git diff --exit-code

      # Saved here rather than at the end of the job: this is the tree the step above just
      # vouched for, before a gate has had the chance to write anything into it. A re-run of
      # this workflow reserves a key that already exists, which actions/cache/save logs as a
      # warning and does not fail on, so the second run keeps the first run's build.
      - name: the build both publish workflows would otherwise make again
        uses: actions/cache/save@v6
        with:
          path: |
            frameworks/**/*.generated.*
            frameworks/react/dist
            frameworks/angular/dist
            frameworks/angular/build
            dist/contracts
          key: arena-build-${{ runner.os }}-${{ github.sha }}

      - name: every gate
        run: bun scripts/check/arena/check-all.ts --no-tests

      - name: the whole suite, counted per domain
        run: bun run ci:summarize
