name: Arena develop

# The name is deliberately not "Arena main": that string is what both publish workflows listen
# for, and a develop run must never be the event that asks whether there is anything to publish.
# Their branches filter would refuse it anyway, so this is the second lock rather than the only
# one, and it is the one that reads here.

on:
  push:
    branches: [develop]

permissions:
  contents: read

concurrency:
  group: develop
  cancel-in-progress: false

env:
  BUN_VERSION: 1.3.14

jobs:
  verify:
    name: build and test everything
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile

      - name: build and assemble, every step run
        run: bun run build:release

      - name: the build is idempotent, so a tracked file it rewrote is a generator out of step
        run: git diff --exit-code

      - name: every gate
        run: bun scripts/check/arena/check-all.ts --no-tests

      - name: the whole suite, counted per domain
        run: bun run ci:summarize

  # Whether the tooling still runs on a machine that is not the one it was written on. One job
  # with a matrix of its own, and deliberately not this whole workflow run three times over: five
  # jobs across three operating systems at ten times the macOS minute rate is a cost nobody keeps
  # paying, and a cost nobody keeps paying becomes a workflow somebody deletes.
  #
  # It asks the question here, once per merge into develop, rather than on the pull request that
  # preceded it. A pull request is pushed to repeatedly and Arena takes them from anyone, so the
  # matrix on that event bills three operating systems per revision of every contribution; this
  # event happens once per change that was accepted. What it costs instead is that a contributor
  # learns their change is not portable after review rather than during it, which is a round trip
  # and never a published defect, because a merge request from develop to main is opened on a
  # green develop and on nothing else.
  #
  # The legs are declared in scripts/ci/arena/supported-os.ts, and check:portability holds this
  # matrix equal to that list, the names and the blocking flags both.
  portable:
    name: portability ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # A leg whose platform is not yet blocking reports and does not gate. The flag lives in
    # scripts/ci/arena/supported-os.ts with its reason, and check:portability holds this equal
    # to it, so a leg cannot quietly stop counting and a supported one cannot quietly stop
    # blocking. It flips to true when the platform is green, which is the whole definition.
    #
    # A leg carrying false reports red and leaves the run green, so the flag is the single place
    # a platform stops gating rather than one place here and a second one in a branch rule.
    continue-on-error: ${{ !matrix.blocking }}
    strategy:
      # Every leg reports. A failure on one is a fact about that platform, and cancelling the
      # others would hide which platforms are fine, which is the whole question being asked.
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            blocking: true
          - os: macos-latest
            blocking: true
          - os: windows-latest
            blocking: true
    steps:
      - name: a path under %TEMP% outruns the 260-char budget before the tree does
        if: runner.os == 'Windows'
        run: git config --system core.longpaths true

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # core.autocrlf is deliberately left at the runner default. Overriding it would prove
      # .gitattributes works by not letting it be tested.

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-cache-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-cache-${{ runner.os }}-

      - name: install, which is the first thing a prebuilt native dependency can refuse
        run: bun install --frozen-lockfile

      - name: a browser, and CHROME_PATH is deliberately not exported
        uses: browser-actions/setup-chrome@v1

      - name: build every step
        run: bun run build

      - name: byte-identical to what the Linux tree committed
        run: git diff --exit-code

      - name: the tooling's own suites, where the injected-platform cases live
        run: bun run test:scripts

      - name: the gates whose answer can differ by platform
        run: bun scripts/ci/arena/run-portability.ts
