name: Arena develop

# The name is deliberately not "Arena main": that string is what both publish workflows listen
# for, and a develop run must never be the event that asks whether there is anything to publish.
# Their branches filter would refuse it anyway, so this is the second lock rather than the only
# one, and it is the one that reads here.

on:
  push:
    branches: [develop]

permissions:
  contents: read

concurrency:
  group: develop
  cancel-in-progress: false

env:
  BUN_VERSION: 1.3.14

jobs:
  verify:
    name: build and test everything
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile

      - name: build and assemble, every step run
        run: bun run build:release

      - name: the build is idempotent, so a tracked file it rewrote is a generator out of step
        run: git diff --exit-code

      - name: every gate
        run: bun scripts/check/arena/check-all.ts --no-tests

      - name: the whole suite, counted per domain
        run: bun run ci:summarize
