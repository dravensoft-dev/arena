name: Arena PR

on:
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: 1.4.0
  NODE_VERSION: 26.7.0

jobs:
  changes:
    name: route
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      domains: ${{ steps.layers.outputs.domains }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - id: layers
        run: |
          git diff --name-only "origin/${{ github.base_ref }}...HEAD" \
            | bun scripts/ci/arena/changed-layers.ts >> "$GITHUB_OUTPUT"

  verify:
    name: verify
    needs: [changes]
    uses: ./.github/workflows/verify.yml
    with:
      domains: ${{ needs.changes.outputs.domains }}

  pr-gate:
    name: pr-gate
    # Every other job in this workflow, and check:portability holds that list complete: a job
    # missing here is a job whose failure the one required check never sees. verify reports
    # failure when any job inside it fails, so naming it names every one of them.
    needs: [changes, verify]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: a skipped job is green, so the result of every job is read rather than its status
        run: |
          echo '${{ toJSON(needs) }}'
          if ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}; then
            echo "pr-gate: at least one job failed or was cancelled"
            exit 1
          fi
          echo "pr-gate: every job that ran passed"
