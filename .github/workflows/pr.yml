name: Arena PR

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: 1.3.14

jobs:
  changes:
    name: route
    runs-on: ubuntu-latest
    outputs:
      react: ${{ steps.layers.outputs.react }}
      angular: ${{ steps.layers.outputs.angular }}
      tailwind: ${{ steps.layers.outputs.tailwind }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - id: layers
        run: |
          git diff --name-only "origin/${{ github.base_ref }}...HEAD" \
            | bun scripts/ci/arena/changed-layers.ts >> "$GITHUB_OUTPUT"

  build:
    name: build
    needs: [changes]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-cache-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-cache-${{ runner.os }}-
      - run: bun install --frozen-lockfile

      - name: build and assemble, every step run
        run: bun run build:release

      - name: the build is idempotent, so a tracked file it rewrote is a generator out of step
        run: git diff --exit-code

      - uses: actions/cache/save@v6
        with:
          path: |
            frameworks/**/*.generated.*
            frameworks/react/dist
            frameworks/angular/dist
            frameworks/angular/build
          key: arena-build-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}

  test-core:
    name: test core
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-cache-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-cache-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - uses: actions/cache/restore@v6
        with:
          path: |
            frameworks/**/*.generated.*
            frameworks/react/dist
            frameworks/angular/dist
            frameworks/angular/build
          key: arena-build-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          fail-on-cache-miss: true

      - name: gates (core and the cross-layer arena domain)
        run: bun scripts/check/arena/check-all.ts --domain=core,arena --no-tests

      - name: suites under scripts/
        run: bun run test:scripts

  test-react:
    name: test react
    needs: [changes, build]
    if: needs.changes.outputs.react == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-cache-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-cache-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - uses: actions/cache/restore@v6
        with:
          path: |
            frameworks/**/*.generated.*
            frameworks/react/dist
            frameworks/angular/dist
            frameworks/angular/build
          key: arena-build-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          fail-on-cache-miss: true

      - name: gates
        run: bun scripts/check/arena/check-all.ts --domain=react --no-tests

      - name: suites with no DOM
        run: bun run test:react

      - name: DOM suites, in a process of their own
        run: bun run test:react-dom

  test-angular:
    name: test angular
    needs: [changes, build]
    if: needs.changes.outputs.angular == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-cache-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-cache-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - uses: actions/cache/restore@v6
        with:
          path: |
            frameworks/**/*.generated.*
            frameworks/react/dist
            frameworks/angular/dist
            frameworks/angular/build
          key: arena-build-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          fail-on-cache-miss: true

      - name: gates
        run: bun scripts/check/arena/check-all.ts --domain=angular --no-tests

      - name: suites, off the ngc emit
        run: bun run test:angular

  test-tailwind:
    name: test tailwind
    needs: [changes, build]
    if: needs.changes.outputs.tailwind == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-cache-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-cache-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - uses: actions/cache/restore@v6
        with:
          path: |
            frameworks/**/*.generated.*
            frameworks/react/dist
            frameworks/angular/dist
            frameworks/angular/build
          key: arena-build-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          fail-on-cache-miss: true

      - name: gates
        run: bun scripts/check/arena/check-all.ts --domain=tailwind --no-tests

  # Whether the tooling still runs on a machine that is not the one it was written on. One job
  # with a matrix of its own, and deliberately not this whole workflow run three times over: five
  # jobs across three operating systems at ten times the macOS minute rate is a cost nobody keeps
  # paying, and a cost nobody keeps paying becomes a workflow somebody deletes.
  #
  # It is a job here rather than a workflow of its own so that pr-gate can read its result, which
  # is the only thing needs can do and the only reason the arrangement matters: a green gate over
  # a red operating system is worse than no gate. The event was already the same one, a merge
  # request to main, which is what makes the price worth paying, since main is what the two
  # packages are published from.
  #
  # The cost of that choice, stated rather than discovered: work that lands on develop and stays
  # there is never asked this question. The merge request is what asks it, and nothing before.
  #
  # The legs are declared in scripts/ci/arena/supported-os.ts, and check:portability holds this
  # matrix equal to that list, the names and the blocking flags both.
  portable:
    name: portability ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # A leg whose platform is not yet blocking reports and does not gate. The flag lives in
    # scripts/ci/arena/supported-os.ts with its reason, and check:portability holds this equal
    # to it, so a leg cannot quietly stop counting and a supported one cannot quietly stop
    # blocking. It flips to true when the platform is green, which is the whole definition.
    #
    # It is also what pr-gate reads: a failing leg carrying this flag hands needs a result of
    # success, so the flag is the single place a platform stops gating, rather than one place
    # here and a second one in the gate below.
    continue-on-error: ${{ !matrix.blocking }}
    strategy:
      # Every leg reports. A failure on one is a fact about that platform, and cancelling the
      # others would hide which platforms are fine, which is the whole question being asked.
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            blocking: true
          - os: macos-latest
            blocking: true
          - os: windows-latest
            blocking: false
    steps:
      - name: a path under %TEMP% outruns the 260-char budget before the tree does
        if: runner.os == 'Windows'
        run: git config --system core.longpaths true

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # core.autocrlf is deliberately left at the runner default. Overriding it would prove
      # .gitattributes works by not letting it be tested.

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-cache-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-cache-${{ runner.os }}-

      - name: install, which is the first thing a prebuilt native dependency can refuse
        run: bun install --frozen-lockfile

      - name: a browser, and CHROME_PATH is deliberately not exported
        uses: browser-actions/setup-chrome@v1

      - name: build every step
        run: bun run build

      - name: byte-identical to what the Linux tree committed
        run: git diff --exit-code

      - name: the tooling's own suites, where the injected-platform cases live
        run: bun run test:scripts

      - name: the gates whose answer can differ by platform
        run: bun scripts/ci/arena/run-portability.ts

  pr-gate:
    name: pr-gate
    # Every other job in this workflow, and check:portability holds that list complete: a job
    # missing here is a job whose failure the one required check never sees.
    needs: [changes, build, test-core, test-react, test-angular, test-tailwind, portable]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: a skipped job is green, so the result of every job is read rather than its status
        run: |
          echo '${{ toJSON(needs) }}'
          if ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}; then
            echo "pr-gate: at least one job failed or was cancelled"
            exit 1
          fi
          echo "pr-gate: every job that ran passed"
