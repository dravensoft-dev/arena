name: Release notes

# It follows a green "Arena main" rather than the push of the tag, so a page describing a release
# is never written over a tree the gates have not passed. That puts it beside the publish
# workflows, on the same event and with the same shape of guard: ask what there is to do, say the
# answer in the run summary, and usually do nothing. The tag is not the one pointing at this
# commit. A release arrives on main as one merge of develop and the tag sits on the merged commit,
# so the question is whether this commit reaches the tag that its own plugin.json hands out.
#
# The gap is the same one the publish workflows carry: a tag pushed after its main run has already
# finished raises no event here, and workflow_dispatch is the way through. Its input is the tag,
# and that path also repairs a page whose notes were written before a subject was corrected.

on:
  workflow_run:
    workflows: ["Arena main"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: the tag to describe, as in v9.0.3
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: false

env:
  BUN_VERSION: 1.3.14

jobs:
  notes:
    name: describe the tag
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      # The whole history, and every tag: the page is the commit log between this tag and the
      # one below it in version order, and a shallow clone has neither.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
          fetch-tags: true

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - id: tag
        name: is there a tag here to describe
        env:
          ASKED: ${{ github.event.inputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          say () {
            echo "$1"
            echo "$1" >> "$GITHUB_STEP_SUMMARY"
          }
          nothing () {
            say "$1"
            echo "write=false" >> "$GITHUB_OUTPUT"
            exit 0
          }

          # A hand dispatch names the tag and means it: it describes what it was given, and it
          # writes over a page that exists, which is the only way one gets rewritten.
          if [ -n "$ASKED" ]; then
            if ! git rev-parse -q --verify "refs/tags/$ASKED" > /dev/null; then
              say "$ASKED is not a tag in this repository."
              exit 1
            fi
            say "Describing $ASKED, asked for by hand."
            echo "tag=$ASKED"  >> "$GITHUB_OUTPUT"
            echo "write=true"  >> "$GITHUB_OUTPUT"
            exit 0
          fi

          VERSION=$(jq -r .version .claude-plugin/plugin.json)
          TAG="v$VERSION"

          if ! git rev-parse -q --verify "refs/tags/$TAG" > /dev/null; then
            nothing "This commit hands out $VERSION and no $TAG exists, so this push carried no release."
          fi

          # Reachable rather than pointing at HEAD: the tag is on the develop commit that this
          # merge brought to main, and --points-at would find nothing on every release.
          if ! git merge-base --is-ancestor "$TAG" HEAD; then
            nothing "$TAG is not reachable from $(git rev-parse --short HEAD), so this build is not the tree that tag names."
          fi

          if gh release view "$TAG" > /dev/null 2>&1; then
            nothing "$TAG already has a page. Dispatch this workflow by hand with the tag to write it again."
          fi

          say "Describing $TAG, which $(git rev-parse --short HEAD) reaches and which has no page yet."
          echo "tag=$TAG"    >> "$GITHUB_OUTPUT"
          echo "write=true"  >> "$GITHUB_OUTPUT"

      - name: the tag is pinned, and the plugin.json it serves hands out its version
        if: steps.tag.outputs.write == 'true'
        run: bun scripts/check/arena/check-release.ts

      - name: write the page from the commit log
        if: steps.tag.outputs.write == 'true'
        run: |
          set -euo pipefail
          bun scripts/ci/arena/release-notes.ts "${{ steps.tag.outputs.tag }}" > release-notes.md
          cat release-notes.md >> "$GITHUB_STEP_SUMMARY"

      # Editing rather than failing, so a re-run repairs a page instead of refusing to touch it.
      - name: publish the page
        if: steps.tag.outputs.write == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ steps.tag.outputs.tag }}"
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release edit "$TAG" --notes-file release-notes.md --title "Arena $TAG"
            echo "$TAG already had a page, and it now says what the commit log says."
          else
            gh release create "$TAG" --verify-tag --notes-file release-notes.md --title "Arena $TAG"
            echo "$TAG has a page."
          fi
