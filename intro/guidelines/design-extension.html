<!-- @dsCard group="Effects" viewport="1120x860" name="Design extension" subtitle="real components, every voice against both themes" -->
<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<link rel="stylesheet" href="../../frameworks/tailwind/consume/Preflight.generated.css">
<link rel="stylesheet" href="../../frameworks/tailwind/consume/components/display/arena-card/ArenaCard.styles.generated.css">
<link rel="stylesheet" href="../../frameworks/tailwind/consume/components/display/arena-tag/ArenaTag.styles.generated.css">
<link rel="stylesheet" href="../../frameworks/tailwind/consume/components/forms/arena-input/ArenaInput.styles.generated.css">
<link rel="stylesheet" href="../../frameworks/tailwind/consume/components/forms/arena-button/ArenaButton.styles.generated.css">
<style>
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--text-strong);font-family:var(--font-body)}
  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:var(--bw-strong);
        background:var(--color-base-300);min-height:100%}
  .q{background:var(--bg);padding:var(--sp-5);display:flex;flex-direction:column;gap:var(--sp-4)}
  .cap{font-family:var(--font-mono);font-size:var(--dz-text-2xs);letter-spacing:var(--ls-label);
       text-transform:uppercase;color:var(--mute)}
  .cap b{color:var(--text-strong);font-weight:var(--fw-semibold)}
  /* The air BETWEEN two peer components, which Arena never draws and a page applies. It is read
     here rather than hard-coded so a voice that re-values rhythm shows the change on this page. */
  .stack{display:flex;flex-direction:column;gap:var(--rhythm-component)}
  .row{display:flex;gap:var(--sp-3);align-items:flex-end}
  .row .arena-input__root{flex:1}
  .prose{font-size:var(--fs-md);color:var(--text-body);margin:0}
</style>
</head><body>
<div class="grid" id="grid"></div>
<script type="module">
import { arenaClassesFor } from '../../frameworks/tailwind/ManifestClasses.js';

const MANIFESTS = '../../frameworks/tailwind/components';
const load = (category, dir, name) =>
  fetch(`${MANIFESTS}/${category}/${dir}/${name}.manifest.json`).then((r) => r.json());

const [card, tag, input, button] = await Promise.all([
  load('display', 'arena-card', 'ArenaCard'),
  load('display', 'arena-tag', 'ArenaTag'),
  load('forms', 'arena-input', 'ArenaInput'),
  load('forms', 'arena-button', 'ArenaButton'),
]);

function el(tag, props = {}, ...children) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) {
    if (v === undefined || v === false) continue;
    if (k === 'text') node.textContent = v;
    else node.setAttribute(k, String(v));
  }
  for (const child of children) node.append(child);
  return node;
}

/* Two peer cards rather than one, so the page shows both halves of what a voice spends: the
   surface itself, which is fill, edge, corner and depth, and the ground between two of them,
   which is rhythm. A single card can only ever show the first. */
function specimen() {
  const c = arenaClassesFor(card, { accent: false, floating: false, interactive: false });
  const t = arenaClassesFor(tag, { tone: 'primary' });
  const i = arenaClassesFor(input, { state: 'neutral' });
  const b = arenaClassesFor(button, { variant: 'primary', size: 'md' });

  const first = el('div', { class: c.root },
    el('div', { class: c.head },
      el('div', {},
        el('div', { class: c.eyebrow, text: 'Peripherals' }),
        el('div', { class: c.title, text: 'Aurora keyboard' })),
      el('span', { class: t.root }, el('span', { class: t.dot }), 'In stock')),
    el('div', { class: c.body },
      el('p', { class: 'prose', text: 'Watch the edge of each card, its corner, whether it sits on the page or above it, and how far apart the two of them stand.' })));

  const second = el('div', { class: c.root },
    el('div', { class: c.body },
      el('div', { class: 'row' },
        el('label', { class: i.root },
          el('span', { class: i.label, text: 'Quantity' }),
          el('span', { class: i.field }, el('input', { class: i.input, value: '1', type: 'text' }))),
        el('button', { class: b.root, type: 'button', text: 'Add to cart' }))));

  return el('div', { class: 'stack' }, first, second);
}

const VOICES = [{ name: 'none', note: 'groups by common region' }].concat(
  getComputedStyle(document.documentElement).getPropertyValue('--arena-extensions')
    .split(',').map((n) => n.trim()).filter(Boolean)
    .map((name) => ({ name, note: 'groups by elevation and air' })));

const THEMES = [{ name: 'dark', scope: '' }, { name: 'light', scope: 'arena-light' }];

const grid = document.getElementById('grid');
grid.style.gridTemplateColumns = `repeat(${VOICES.length}, 1fr)`;

for (const theme of THEMES) {
  for (const voice of VOICES) {
    const scope = ['q', theme.scope, voice.name === 'none' ? '' : `arena-${voice.name}`]
      .filter(Boolean).join(' ');
    const caption = el('div', { class: 'cap' },
      el('b', { text: voice.name === 'none' ? 'no extension' : `.arena-${voice.name}` }),
      ` · ${theme.name} · ${voice.note}`);
    grid.append(el('div', { class: scope }, caption, specimen()));
  }
}
</script>
</body></html>
