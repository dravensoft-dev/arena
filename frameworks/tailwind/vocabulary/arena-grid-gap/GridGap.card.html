<!-- @dsCard group="Tailwind" viewport="820x520" name="grid-gap" subtitle="A box family: arena-grid-gap-component is the default, none, group and section change the air between cells, and the property is the route for a gap no step names" -->
<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../../../intro/styles.css">
<link rel="stylesheet" href="../../consume/Preflight.generated.css">
<link rel="stylesheet" href="../../consume/components/layout/arena-grid/ArenaGrid.styles.generated.css">
<link rel="stylesheet" href="../../consume/vocabulary/GridGap.generated.css">
<link rel="stylesheet" href="../../Specimen.css">
</head><body><div id="root"></div>
<script type="module">
import { mountSpecimen, section, el, arenaClassesFor, arenaSlotDataFor } from '../../Specimen.js';

const manifest = await (await fetch('../../components/layout/arena-grid/ArenaGrid.manifest.json')).json();
const AXIS = '--arena-grid-gap';

function cell(text) {
  return el('div', {
    class: 'bg-base-300 border-[length:var(--bw)] border-neutral rounded-sm px-3 py-2.5 font-mono text-ctl-sm text-base-content/82',
    text,
  });
}

function grid(option) {
  const c = arenaClassesFor(manifest);
  const d = arenaSlotDataFor(manifest);
  const box = el('div', { class: `${c.root} ${option}`, ...d.root });
  for (let i = 1; i <= 4; i += 1) box.append(cell(`Cell ${i}`));
  return box;
}

function set(value) {
  const holder = el('div', { style: { display: 'contents', [AXIS]: value } });
  holder.append(grid(''));
  return holder;
}

mountSpecimen({ sections: [
  section('arena-grid-gap-none', [grid('arena-grid-gap-none')], { stack: true }),
  section('arena-grid-gap-group', [grid('arena-grid-gap-group')], { stack: true }),
  section('arena-grid-gap-component, the default', [grid('arena-grid-gap-component')], { stack: true }),
  section('arena-grid-gap-section', [grid('arena-grid-gap-section')], { stack: true }),
  section('--arena-grid-gap: calc(var(--rhythm-group) / 2) on a container', [set('calc(var(--rhythm-group) / 2)')], { stack: true }),
]});
</script></body></html>
