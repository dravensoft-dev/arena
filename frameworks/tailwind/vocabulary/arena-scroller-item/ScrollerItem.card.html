<!-- @dsCard group="Tailwind" viewport="820x520" name="scroller-item" subtitle="A box family: arena-scroller-item-md is the default, sm and lg change how wide each item is laid out, and the property is the route for a width no step names" -->
<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../../../intro/styles.css">
<link rel="stylesheet" href="../../consume/Preflight.generated.css">
<link rel="stylesheet" href="../../consume/components/layout/arena-scroller/ArenaScroller.styles.generated.css">
<link rel="stylesheet" href="../../consume/components/layout/arena-scroller-item/ArenaScrollerItem.styles.generated.css">
<link rel="stylesheet" href="../../consume/vocabulary/ScrollerItem.generated.css">
<link rel="stylesheet" href="../../Specimen.css">
</head><body><div id="root"></div>
<script type="module">
import { mountSpecimen, section, el, arenaClassesFor, arenaSlotDataFor } from '../../Specimen.js';

const row = await (await fetch('../../components/layout/arena-scroller/ArenaScroller.manifest.json')).json();
const item = await (await fetch('../../components/layout/arena-scroller-item/ArenaScrollerItem.manifest.json')).json();
const AXIS = '--arena-scroller-item';
const LOTS = ['Finca El Injerto', 'Kochere Lot 4', 'La Esperanza', 'Kiangoi AA', 'Gicherori', 'Buku Sayo'];

function rail(option) {
  const box = el('div', {
    class: `${arenaClassesFor(row, { behaviour: 'snap' }).root} ${option}`,
    ...arenaSlotDataFor(row, { behaviour: 'snap' }).root,
  });
  for (const name of LOTS) {
    const cell = el('div', { class: arenaClassesFor(item, {}).root, ...arenaSlotDataFor(item, {}).root });
    cell.append(el('div', {
      class: 'bg-base-300 border-[length:var(--bw)] border-neutral rounded-sm px-3 py-2.5 font-mono text-ctl-sm text-base-content/82',
      text: name,
    }));
    box.append(cell);
  }
  return box;
}

function set(value) {
  const holder = el('div', { style: { display: 'contents', [AXIS]: value } });
  holder.append(rail(''));
  return holder;
}

mountSpecimen({ sections: [
  section('arena-scroller-item-sm', [rail('arena-scroller-item-sm')], { stack: true }),
  section('arena-scroller-item-md, the default', [rail('arena-scroller-item-md')], { stack: true }),
  section('arena-scroller-item-lg', [rail('arena-scroller-item-lg')], { stack: true }),
  section('--arena-scroller-item: calc(var(--scroller-item-md) * 1.5) on a container', [set('calc(var(--scroller-item-md) * 1.5)')], { stack: true }),
]});
</script></body></html>
