<!-- @dsCard group="Tailwind" viewport="820x520" name="grid-min" subtitle="A box family: arena-grid-min-md is the default, sm and lg change the narrowest cell, and the property is the route for a width no step names" -->
<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../../../intro/styles.css">
<link rel="stylesheet" href="../../consume/Preflight.generated.css">
<link rel="stylesheet" href="../../consume/components/layout/arena-grid/ArenaGrid.styles.generated.css">
<link rel="stylesheet" href="../../consume/vocabulary/GridMin.generated.css">
<link rel="stylesheet" href="../../Specimen.css">
</head><body><div id="root"></div>
<script type="module">
import { mountSpecimen, section, el, arenaClassesFor, arenaSlotDataFor } from '../../Specimen.js';

const manifest = await (await fetch('../../components/layout/arena-grid/ArenaGrid.manifest.json')).json();
const AXIS = '--arena-grid-min';

function cell(text) {
  return el('div', {
    class: 'bg-base-300 border-[length:var(--bw)] border-neutral rounded-sm px-3 py-2.5 font-mono text-ctl-sm text-base-content/82',
    text,
  });
}

function grid(option) {
  const c = arenaClassesFor(manifest);
  const d = arenaSlotDataFor(manifest);
  const box = el('div', { class: `${c.root} ${option}`, ...d.root });
  for (let i = 1; i <= 4; i += 1) box.append(cell(`Cell ${i}`));
  return box;
}

function set(value) {
  const holder = el('div', { style: { display: 'contents', [AXIS]: value } });
  holder.append(grid(''));
  return holder;
}

mountSpecimen({ sections: [
  section('arena-grid-min-sm', [grid('arena-grid-min-sm')], { stack: true }),
  section('arena-grid-min-md, the default', [grid('arena-grid-min-md')], { stack: true }),
  section('arena-grid-min-lg', [grid('arena-grid-min-lg')], { stack: true }),
  section('--arena-grid-min: calc(var(--grid-min) * 1.5) on a container', [set('calc(var(--grid-min) * 1.5)')], { stack: true }),
]});
</script></body></html>
