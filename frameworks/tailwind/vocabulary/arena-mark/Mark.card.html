<!-- @dsCard group="Tailwind" viewport="760x220" name="mark" subtitle="A box family: arena-mark-soft is the default wash, and arena-mark-solid fills a badge with its tone's ink and sets its label in that tone's on-ink" -->
<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../../../intro/styles.css">
<link rel="stylesheet" href="../../consume/Preflight.generated.css">
<link rel="stylesheet" href="../../consume/components/display/arena-badge/ArenaBadge.styles.generated.css">
<link rel="stylesheet" href="../../consume/vocabulary/Mark.generated.css">
<link rel="stylesheet" href="../../Specimen.css">
</head><body><div id="root"></div>
<script type="module">
import { mountSpecimen, section, el, arenaClassesFor, arenaSlotDataFor } from '../../Specimen.js';

const manifest = await (await fetch('../../components/display/arena-badge/ArenaBadge.manifest.json')).json();
const TONES = ['neutral', 'success', 'warning', 'danger', 'info'];

function badge(tone, option, dot = false) {
  const c = arenaClassesFor(manifest, { tone });
  const d = arenaSlotDataFor(manifest, { tone });
  const node = el('span', { class: `${c.root} ${option}`, 'data-arena-part': 'badge', 'data-arena-boundary': '', ...d.root });
  if (dot) node.append(el('span', { class: c.dot, 'data-arena-part': 'badge.dot', ...d.dot }));
  node.append(tone);
  return node;
}

mountSpecimen({ sections: [
  section('arena-mark-soft, the default', TONES.map((tone) => badge(tone, 'arena-mark-soft'))),
  section('arena-mark-solid', TONES.map((tone) => badge(tone, 'arena-mark-solid'))),
  section('A live indicator', [badge('danger', 'arena-mark-solid', true)]),
]});
</script></body></html>
