<!-- @dsCard group="Tailwind" viewport="700x320" name="ArenaRadio" subtitle="A group with hints, rendered from ArenaRadio.manifest.json" -->
<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../../../../intro/styles.css">
<link rel="stylesheet" href="../../../consume/Preflight.generated.css">
<link rel="stylesheet" href="../../../consume/components/forms/arena-radio/ArenaRadio.styles.generated.css">
<link rel="stylesheet" href="../../../Specimen.css">
</head><body><div id="root"></div>
<script type="module">
import { mountSpecimen, section, el, arenaClassesFor, arenaSlotDataFor } from '../../../Specimen.js';

const manifest = await (await fetch('./ArenaRadio.manifest.json')).json();
const base = arenaClassesFor(manifest);
const dBase = arenaSlotDataFor(manifest);

function radio({ label, hint, checked = false, disabled = false, name }) {
  const c = arenaClassesFor(manifest, { checked: String(checked), disabled: String(disabled) });
  const d = arenaSlotDataFor(manifest, { checked: String(checked), disabled: String(disabled) });
  const ring = el('span', { class: c.ring, ...d.ring });
  if (checked) ring.append(el('span', { class: c.dot, ...d.dot }));
  const text = el('span', { class: c.text, ...d.text }, el('span', { class: c.label, ...d.label, text: label }));
  if (hint) text.append(el('span', { class: c.hint, ...d.hint, text: hint }));
  const input = el('input', { type: 'radio', name, class: c.input, ...d.input, checked: checked || undefined, disabled: disabled || undefined });
  return el('label', { class: c.root, ...d.root }, ring, text, input);
}

function group(options) {
  const name = 'rg-' + Math.random().toString(36).slice(2, 7);
  const box = el('div', { class: base.group, ...dBase.group, role: 'radiogroup' });
  for (const option of options) box.append(radio({ ...option, name }));
  return box;
}

mountSpecimen({ sections: [
  section('A group', [group([
    { label: 'Deploy on merge', hint: 'Every merge to main ships immediately.', checked: true },
    { label: 'Deploy on tag', hint: 'Only a release tag ships.' },
    { label: 'Manual only', hint: 'Locked by the organisation policy.', disabled: true },
  ])]),
]});
</script></body></html>
