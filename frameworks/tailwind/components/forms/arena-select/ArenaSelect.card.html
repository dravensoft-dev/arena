<!-- @dsCard group="Tailwind" viewport="700x260" name="ArenaSelect" subtitle="The closed control, rendered from ArenaSelect.manifest.json" -->
<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../../../../intro/styles.css">
<link rel="stylesheet" href="../../../consume/Preflight.generated.css">
<link rel="stylesheet" href="../../../consume/components/forms/arena-select/ArenaSelect.styles.generated.css">
<link rel="stylesheet" href="../../../Specimen.css">
</head><body><div id="root"></div>
<script type="module">
import { mountSpecimen, section, el, arenaClassesFor, arenaSlotDataFor } from '../../../Specimen.js';

const manifest = await (await fetch('./ArenaSelect.manifest.json')).json();

function select({ label, options, value, disabled }) {
  const c = arenaClassesFor(manifest, { disabled: String(Boolean(disabled)) });
  const d = arenaSlotDataFor(manifest, { disabled: String(Boolean(disabled)) });
  const root = el('div', { class: c.root, ...d.root });
  root.style.width = '240px';
  const selectId = label ? 'tw-select-' + label.replace(/\s+/g, '-').toLowerCase() : undefined;
  if (label) root.append(el('label', { class: c.label, ...d.label, for: selectId, text: label }));
  const field = el('select', { class: c.field, ...d.field, id: selectId, disabled: disabled || undefined });
  for (const option of options) {
    field.append(el('option', { value: option, selected: option === value || undefined }, option));
  }
  root.append(el('div', { class: c.wrap, ...d.wrap }, field, el('span', { class: c.caret, ...d.caret }, el('i', { class: 'ph-bold ph-caret-down', 'aria-hidden': 'true' }))));
  return root;
}

mountSpecimen({ sections: [
  section('Default', [select({ label: 'Environment', options: ['Production', 'Staging', 'Preview'], value: 'Staging' })]),
  section('Disabled', [select({ label: 'Region', options: ['eu-west-1'], value: 'eu-west-1', disabled: true })]),
]});
</script></body></html>
