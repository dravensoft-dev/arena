<!-- @dsCard group="Tailwind" viewport="700x330" name="ArenaSwitch" subtitle="Sizes, orientation, icon-per-state and guarded, rendered from ArenaSwitch.manifest.json" -->
<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../../../../intro/styles.css">
<link rel="stylesheet" href="../../../consume/Preflight.generated.css">
<link rel="stylesheet" href="../../../consume/components/forms/arena-switch/ArenaSwitch.styles.generated.css">
<link rel="stylesheet" href="../../../consume/vocabulary/Size.generated.css">
<link rel="stylesheet" href="../../../consume/vocabulary/Orientation.generated.css">
<link rel="stylesheet" href="../../../Specimen.css">
</head><body><div id="root"></div>
<script type="module">
import { mountSpecimen, section, el, arenaClassesFor, arenaSlotDataFor } from '../../../Specimen.js';

const manifest = await (await fetch('./ArenaSwitch.manifest.json')).json();

function toggle({ label, cls = '', checked = false, disabled = false, confirm = false, iconOn, iconOff }) {
  const c = arenaClassesFor(manifest, { state: String(checked), disabled: String(disabled) });
  const d = arenaSlotDataFor(manifest, { state: String(checked), disabled: String(disabled) });
  const icon = checked ? iconOn : iconOff;
  const knob = el('span', { class: c.knob, ...d.knob }, icon ? el('i', { class: `${c.icon} ${icon}`, ...d.icon }) : '');
  const track = el('button', { type: 'button', role: 'switch', class: c.track, ...d.track, 'aria-checked': String(checked), 'aria-label': label, disabled: disabled || undefined }, knob);
  const text = el('span', { class: c.label, ...d.label }, label);
  if (confirm) text.append(el('i', { class: `${c.guard} ph-bold ph-shield-check`, ...d.guard, title: 'Requires confirmation' }));
  return el('span', { class: `${c.root} ${cls}`.trim(), ...d.root }, track, text);
}

mountSpecimen({ sections: [
  section('States', [
    toggle({ label: 'Email notifications', checked: true, iconOn: 'ph-bold ph-check', iconOff: 'ph-bold ph-x' }),
    toggle({ label: 'Slack notifications', iconOn: 'ph-bold ph-check', iconOff: 'ph-bold ph-x' }),
    toggle({ label: 'Managed by policy', checked: true, disabled: true }),
  ]),
  section('Sizes — sm to 2xl', ['sm', 'md', 'lg', 'xl', '2xl'].map((size) =>
    toggle({ label: size, cls: `arena-size-${size}`, checked: true, iconOn: 'ph-bold ph-check' })
  )),
  section('Orientation', [
    toggle({ label: 'Horizontal', cls: 'arena-orientation-horizontal', checked: true, iconOn: 'ph-bold ph-check' }),
    toggle({ label: 'Vertical', cls: 'arena-orientation-vertical', checked: true, iconOn: 'ph-bold ph-check' }),
  ]),
  section('Guarded — opens a confirmation instead of flipping', [
    toggle({ label: 'Auto-deploy to production', checked: true, confirm: true }),
  ]),
]});
</script></body></html>
