<!-- @dsCard group="Tailwind" viewport="760x340" name="ArenaButton" subtitle="Variants, sizes (the arena-size options) and states, rendered from ArenaButton.manifest.json" -->
<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../../../../intro/styles.css">
<link rel="stylesheet" href="../../../consume/Preflight.generated.css">
<link rel="stylesheet" href="../../../consume/components/forms/arena-button/ArenaButton.styles.generated.css">
<link rel="stylesheet" href="../../../consume/vocabulary/Size.generated.css">
<link rel="stylesheet" href="../../../Specimen.css">
</head><body><div id="root"></div>
<script type="module">
import { mountSpecimen, section, el, arenaClassesFor, arenaSlotDataFor } from '../../../Specimen.js';

const manifest = await (await fetch('./ArenaButton.manifest.json')).json();

function button(label, opts = {}, { disabled = false, loading = false, cls = '' } = {}) {
  const c = arenaClassesFor(manifest, opts);
  const d = arenaSlotDataFor(manifest, opts);
  const node = el('button', { class: `${c.root} ${cls}`.trim(), ...d.root, type: 'button', disabled: (disabled || loading) || undefined });
  if (loading) node.append(el('span', { class: c.spinner, ...d.spinner, 'aria-hidden': 'true' }));
  node.append(label);
  return node;
}

mountSpecimen({ sections: [
  section('Variants', ['primary', 'secondary', 'ghost'].map((variant) =>
    button(variant[0].toUpperCase() + variant.slice(1), { variant }))),
  section('Destructive', [button('Delete', { destructive: true })]),
  section('Sizes', ['sm', 'md', 'lg'].map((size) => button(`Deploy (${size})`, {}, { cls: `arena-size-${size}` }))),
  section('States', [
    button('Disabled', {}, { disabled: true }),
    button('Loading', {}, { loading: true }),
  ]),
]});
</script></body></html>
