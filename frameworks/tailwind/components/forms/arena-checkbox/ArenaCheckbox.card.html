<!-- @dsCard group="Tailwind" viewport="700x101" name="ArenaCheckbox" subtitle="Checked, unchecked and disabled, rendered from ArenaCheckbox.manifest.json" -->
<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../../../../intro/styles.css">
<link rel="stylesheet" href="../../../consume/Preflight.generated.css">
<link rel="stylesheet" href="../../../consume/components/forms/arena-checkbox/ArenaCheckbox.styles.generated.css">
<link rel="stylesheet" href="../../../Specimen.css">
</head><body><div id="root"></div>
<script type="module">
import { mountSpecimen, section, el, arenaClassesFor, arenaSlotDataFor } from '../../../Specimen.js';

const manifest = await (await fetch('./ArenaCheckbox.manifest.json')).json();

// Token-valued, not hand-typed: `--sp-3` (12px) is the check glyph's box and `--bw-strong`
// (2px) is its stroke, bound as a camelCase `[style]` object so a token change cannot drift
// silently under a literal that `check:dimensions` never scans in a `.card.html`.
const ARENA_CHECK_GLYPH_STYLE = { width: 'var(--sp-3)', height: 'var(--sp-3)' };
const ARENA_CHECK_STROKE_STYLE = { strokeWidth: 'var(--bw-strong)' };

function checkbox({ label, checked = false, disabled = false }) {
  const c = arenaClassesFor(manifest, { checked: String(checked), disabled: String(disabled) });
  const d = arenaSlotDataFor(manifest, { checked: String(checked), disabled: String(disabled) });
  const box = el('span', { class: c.box, ...d.box });
  if (checked) {
    const svg = el('svg', { viewBox: '0 0 12 12', fill: 'none', class: c.check, ...d.check, style: ARENA_CHECK_GLYPH_STYLE });
    svg.append(el('path', { d: 'M2 6l3 3 5-6', stroke: 'currentColor', 'stroke-linecap': 'round', 'stroke-linejoin': 'round', style: ARENA_CHECK_STROKE_STYLE }));
    box.append(svg);
  }
  const input = el('input', { type: 'checkbox', class: c.input, ...d.input, checked: checked || undefined, disabled: disabled || undefined });
  return el('label', { class: c.root, ...d.root }, box, el('span', { class: c.label, ...d.label, text: label }), input);
}

mountSpecimen({ sections: [
  section('States', [
    checkbox({ label: 'Notify on failure', checked: true }),
    checkbox({ label: 'Notify on success' }),
    checkbox({ label: 'Managed by policy', checked: true, disabled: true }),
  ]),
]});
</script></body></html>
