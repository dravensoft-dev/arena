<!-- @dsCard group="Tailwind" viewport="820x300" name="ArenaPaletteScope" subtitle="The ground a palette island paints, rendered from ArenaPaletteScope.manifest.json" -->
<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../../../../intro/styles.css">
<link rel="stylesheet" href="../../../consume/Preflight.generated.css">
<link rel="stylesheet" href="../../../consume/components/layout/arena-palette-scope/ArenaPaletteScope.styles.generated.css">
<link rel="stylesheet" href="../../../Specimen.css">
</head><body><div id="root"></div>
<script type="module">
import { mountSpecimen, section, el, arenaClassesFor, arenaSlotDataFor } from '../../../Specimen.js';

const manifest = await (await fetch('./ArenaPaletteScope.manifest.json')).json();
const c = arenaClassesFor(manifest, {});
const d = arenaSlotDataFor(manifest, {});

function island(palette, text) {
  const root = el('div', { class: `${c.root} arena-${palette}`, ...d.root });
  root.append(el('div', { class: 'font-body text-sm p-4', text }));
  return root;
}

mountSpecimen({ sections: [
  section('A light island', [island('light', 'This subtree answers the light palette.')], { stack: true }),
  section('A dark island', [island('dark', 'This subtree answers the dark palette.')], { stack: true }),
  section('What it paints', [
    el('div', { class: 'font-body text-sm text-base-content/62' },
      'The palette class sets variables and paints nothing. The scope adds base-100 as the ground '
      + 'and base-content as the ink, so an island reads as its own palette whatever the page is.'),
  ]),
]});
</script></body></html>
