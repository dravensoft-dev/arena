<!-- @dsCard group="Tailwind" viewport="820x300" name="ArenaScrollerItem" subtitle="The cell a row sizes and settles on, rendered from ArenaScrollerItem.manifest.json" -->
<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../../../../intro/styles.css">
<link rel="stylesheet" href="../../../consume/Preflight.generated.css">
<link rel="stylesheet" href="../../../consume/components/layout/arena-scroller/ArenaScroller.styles.generated.css">
<link rel="stylesheet" href="../../../consume/components/layout/arena-scroller-item/ArenaScrollerItem.styles.generated.css">
<link rel="stylesheet" href="../../../Specimen.css">
</head><body><div id="root"></div>
<script type="module">
import { mountSpecimen, section, el, arenaClassesFor } from '../../../Specimen.js';

const item = await (await fetch('./ArenaScrollerItem.manifest.json')).json();
const row = await (await fetch('../arena-scroller/ArenaScroller.manifest.json')).json();

const LOTS = ['Finca El Injerto', 'Kochere Lot 4 with a much longer name than its neighbours', 'La Esperanza', 'Kiangoi AA'];

function rail() {
  const box = el('div', {
    class: arenaClassesFor(row, { behaviour: 'snap' }).root,
    style: { '--arena-scroller-item': 'calc(var(--sp-1) * 44)' },
  });
  for (const name of LOTS) {
    const cell = el('div', { class: arenaClassesFor(item, {}).root });
    cell.append(el('div', {
      class: 'bg-base-300 border-[length:var(--bw)] border-neutral rounded-sm px-3 py-2.5 '
        + 'font-mono text-ctl-sm text-base-content/82',
      text: name,
    }));
    box.append(cell);
  }
  return box;
}

mountSpecimen({ sections: [
  section('One width, whatever the cell holds', [rail()], { stack: true }),
  section('Why it is a component', [
    el('div', { class: 'font-body text-sm text-base-content/62' },
      'A row cannot reach inside its children to size them, and a child that is an Arena component '
      + 'may take its own host out of layout, so a rule aimed at the row\'s direct children lands on '
      + 'an element with no box. The cell is the box that is always there.'),
  ]),
]});
</script></body></html>
