<!-- @dsCard group="Tailwind" viewport="760x215" name="ArenaBulkActionBar" subtitle="ArenaSelection actions, rendered from ArenaBulkActionBar.manifest.json" -->
<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../../../../intro/styles.css">
<link rel="stylesheet" href="../../../consume/Preflight.generated.css">
<link rel="stylesheet" href="../../../consume/components/navigation/arena-bulk-action-bar/ArenaBulkActionBar.styles.generated.css">
<link rel="stylesheet" href="../../../Specimen.css">
</head><body><div id="root"></div>
<script type="module">
import { mountSpecimen, section, el, arenaClassesFor, arenaSlotDataFor } from '../../../Specimen.js';

const manifest = await (await fetch('./ArenaBulkActionBar.manifest.json')).json();
const base = arenaClassesFor(manifest, { open: true });
const dBase = arenaSlotDataFor(manifest, { open: true });

function bar(count, noun, actions) {
  const list = el('div', { class: base.actions, ...dBase.actions });
  for (const action of actions) {
    const c = arenaClassesFor(manifest, { destructive: !!action.destructive });
    const d = arenaSlotDataFor(manifest, { destructive: !!action.destructive });
    const button = el('button', { class: c.action, ...d.action, type: 'button' });
    if (action.icon) button.append(el('span', { class: base.actionIcon, ...dBase.actionIcon }, el('i', { class: action.icon, 'aria-hidden': 'true' })));
    button.append(action.label);
    list.append(button);
  }
  return el('div', { class: base.root, ...dBase.root, role: 'region', 'aria-label': 'Actions on the selection' },
    el('span', { class: base.count, ...dBase.count }, el('b', { class: base.number, ...dBase.number, text: String(count) }), ` ${noun} selected`),
    el('span', { class: base.divider, ...dBase.divider }),
    list,
    el('button', { class: base.clear, ...dBase.clear, type: 'button', text: 'Clear' }));
}

mountSpecimen({ sections: [
  section('With a destructive action', [bar(12, 'deployments', [
    { id: 'rerun', label: 'Re-run', icon: 'ph-bold ph-arrow-clockwise' },
    { id: 'archive', label: 'Archive', icon: 'ph-bold ph-archive' },
    { id: 'delete', label: 'Delete', icon: 'ph-bold ph-trash', destructive: true },
  ])], { stack: true }),
  section('Single selection', [bar(1, 'project', [{ id: 'export', label: 'Export', icon: 'ph-bold ph-download-simple' }])], { stack: true }),
]});
</script></body></html>
