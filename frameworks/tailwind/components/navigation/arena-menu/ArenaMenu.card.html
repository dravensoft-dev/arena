<!-- @dsCard group="Tailwind" viewport="700x400" name="ArenaMenu" subtitle="Items, headers and dividers, rendered from ArenaMenu.manifest.json" -->
<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../../../../intro/styles.css">
<link rel="stylesheet" href="../../../consume/Preflight.generated.css">
<link rel="stylesheet" href="../../../consume/components/navigation/arena-menu/ArenaMenu.styles.generated.css">
<link rel="stylesheet" href="../../../Specimen.css">
</head><body><div id="root"></div>
<script type="module">
import { mountSpecimen, section, el, arenaClassesFor, arenaSlotDataFor } from '../../../Specimen.js';

const manifest = await (await fetch('./ArenaMenu.manifest.json')).json();
const c = arenaClassesFor(manifest);
const d = arenaSlotDataFor(manifest);

const ITEMS = [
  { header: 'This deployment' },
  { label: 'View logs', icon: 'ph-bold ph-list-magnifying-glass', shortcut: 'L' },
  { label: 'Re-run', icon: 'ph-bold ph-arrow-clockwise' },
  { label: 'Promote', icon: 'ph-bold ph-arrow-fat-line-up', disabled: true },
  { divider: true },
  { label: 'Delete', icon: 'ph-bold ph-trash', destructive: true },
];

/* Rendered open and un-pinned: the panel is `absolute`, and a specimen that had
   to hover a trigger would show nothing in a screenshot. */
function menu() {
  const panel = el('div', { class: c.panel, ...d.panel, role: 'menu' });
  panel.style.position = 'static';
  for (const item of ITEMS) {
    if (item.divider) { panel.append(el('div', { class: c.divider, ...d.divider })); continue; }
    if (item.header) { panel.append(el('div', { class: c.header, ...d.header, text: item.header })); continue; }
    /* The item is three compounds of disabled and destructive, in this order: disabled, then
       destructive, then the default row. Disabled wins unconditionally, and the default row's
       hover must not reach a disabled or destructive row, because Tailwind orders the generated
       rules alphabetically by value rather than by manifest order and the wrong hover would win
       the cascade. */
    const chosen = { disabled: Boolean(item.disabled), destructive: Boolean(item.destructive) };
    const classes = arenaClassesFor(manifest, chosen).item;
    const data = arenaSlotDataFor(manifest, chosen).item;
    const row = el('button', { class: classes, ...data, type: 'button', role: 'menuitem', disabled: item.disabled },
      el('span', { class: c.icon, ...d.icon }, el('i', { class: item.icon, 'aria-hidden': 'true' })),
      el('span', { class: c.label, ...d.label, text: item.label }));
    if (item.shortcut) row.append(el('span', { class: c.shortcut, ...d.shortcut, text: item.shortcut }));
    panel.append(row);
  }
  const box = el('div', { class: c.root, ...d.root });
  box.style.display = 'block';
  box.style.width = '240px';
  box.append(panel);
  return box;
}

mountSpecimen({ sections: [section('Open — hover a row', [menu()])]});
</script></body></html>
