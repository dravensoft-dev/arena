<!-- @dsCard group="Tailwind" viewport="760x260" name="ArenaLink" subtitle="A link in a sentence, an external link and a link in a heading, rendered from ArenaLink.manifest.json" -->
<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../../../../intro/styles.css">
<link rel="stylesheet" href="../../../consume/Preflight.generated.css">
<link rel="stylesheet" href="../../../consume/components/navigation/arena-link/ArenaLink.styles.generated.css">
<link rel="stylesheet" href="../../../Specimen.css">
</head><body><div id="root"></div>
<script type="module">
import { mountSpecimen, section, el, arenaClassesFor, arenaSlotDataFor } from '../../../Specimen.js';

const manifest = await (await fetch('./ArenaLink.manifest.json')).json();
const c = arenaClassesFor(manifest, {});
const d = arenaSlotDataFor(manifest, {});

function link(text, external = false) {
  const a = el('a', { class: c.root, ...d.root, href: '#release-notes', text });
  if (external) {
    a.setAttribute('target', '_blank');
    a.setAttribute('rel', 'noopener noreferrer');
    a.append(el('span', { class: c.external, ...d.external, text: ' (opens in a new tab)' }));
  }
  return a;
}

const sentence = (...parts) => el('p', { class: 'font-body text-sm' }, ...parts);

mountSpecimen({ sections: [
  section('Inside a sentence: the underline is always on', [sentence('Read ', link('the release notes'), ' before you upgrade.')], { stack: true }),
  section('External: the hint is said and never drawn', [sentence('The ', link('status page', true), ' lists every incident.')], { stack: true }),
  section('Inside a heading, where it takes the heading\'s size', [el('h3', { class: 'font-display text-xl' }, 'See ', link('what changed'))], { stack: true }),
]});
</script></body></html>
