<!-- @dsCard group="Tailwind" viewport="700x240" name="ArenaTabs" subtitle="Navigation between views, rendered from ArenaTabs.manifest.json" -->
<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../../../../intro/styles.css">
<link rel="stylesheet" href="../../../consume/Preflight.generated.css">
<link rel="stylesheet" href="../../../consume/components/navigation/arena-tabs/ArenaTabs.styles.generated.css">
<link rel="stylesheet" href="../../../Specimen.css">
</head><body><div id="root"></div>
<script type="module">
import { mountSpecimen, section, el, arenaClassesFor, arenaSlotDataFor } from '../../../Specimen.js';

const manifest = await (await fetch('./ArenaTabs.manifest.json')).json();

function tabs(labels, active) {
  const root = el('div', { class: arenaClassesFor(manifest).root, ...arenaSlotDataFor(manifest).root });
  for (const label of labels) {
    const c = arenaClassesFor(manifest, { selected: String(label === active) });
    const d = arenaSlotDataFor(manifest, { selected: String(label === active) });
    root.append(el('button', { class: c.tab, ...d.tab, type: 'button', text: label }));
  }
  return root;
}

mountSpecimen({ sections: [
  section('Three views', [tabs(['Overview', 'Deployments', 'Settings'], 'Deployments')], { stack: true }),
  section('First selected', [tabs(['Logs', 'Metrics'], 'Logs')], { stack: true }),
]});
</script></body></html>
