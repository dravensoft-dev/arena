<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../../../../intro/styles.css">
<link rel="stylesheet" href="../../../consume/Preflight.generated.css">
<link rel="stylesheet" href="../../../consume/components/display/arena-activity-feed/ArenaActivityFeed.styles.generated.css">
<link rel="stylesheet" href="../../../consume/vocabulary/Accent.generated.css">
<link rel="stylesheet" href="../../../Specimen.css">
</head><body><div id="root"></div>
<script type="module">
import { mountSpecimen, section, el, arenaClassesFor, arenaSlotDataFor } from '../../../Specimen.js';

const manifest = await (await fetch('./ArenaActivityFeed.manifest.json')).json();

function feed(items, accent = '') {
  const root = el('ul', { class: `${arenaClassesFor(manifest).root} ${accent}`.trim(), ...arenaSlotDataFor(manifest).root });
  items.forEach((item, i) => {
    const c = arenaClassesFor(manifest, { tone: item.tone, divided: i > 0 });
    const d = arenaSlotDataFor(manifest, { tone: item.tone, divided: i > 0 });
    const text = el('span', { class: c.text, ...d.text }, el('b', { class: c.actor, ...d.actor, text: item.actor }), ` ${item.action} `);
    if (item.target) text.append(el('span', { class: c.target, ...d.target, text: item.target }));
    const li = el('li', { class: c.item, ...d.item }, el('span', { class: c.dot, ...d.dot }), text);
    if (item.time) li.append(el('span', { class: c.time, ...d.time, text: item.time }));
    root.append(li);
  });
  root.style.width = '520px';
  return root;
}

mountSpecimen({ sections: [
  section('A feed', [feed([
    { actor: 'Marta', action: 'deployed', target: 'billing@2.4.1', time: '2m', tone: 'success' },
    { actor: 'Ivan', action: 'opened an incident on', target: 'auth', time: '18m', tone: 'danger' },
    { actor: 'Rae', action: 'approved the rollback', time: '1h' },
    { actor: 'Noor', action: 'invited', target: 'j.okafor@client.io', time: '3h', tone: 'info' },
  ])], { stack: true }),
  section('A gold feed: an item with no tone wears the feed\'s accent', [feed([
    { actor: 'Rae', action: 'approved the rollback', time: '1h' },
    { actor: 'Marta', action: 'deployed', target: 'billing@2.4.1', time: '2m', tone: 'success' },
  ], 'arena-accent-gold')]),
]});
</script></body></html>
