<!-- @dsCard group="Tailwind" viewport="900x469" name="ArenaCalendar" subtitle="Chrome and chip rendered from ArenaCalendar.manifest.json — the geometry is asserted here, not derived" -->
<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../../../../intro/styles.css">
<link rel="stylesheet" href="../../../consume/Preflight.generated.css">
<link rel="stylesheet" href="../../../consume/components/display/arena-calendar/ArenaCalendar.styles.generated.css">
<link rel="stylesheet" href="../../../Specimen.css">
</head><body><div id="root"></div>
<script type="module">
import { mountSpecimen, section, el, arenaClassesFor } from '../../../Specimen.js';

const manifest = await (await fetch('./ArenaCalendar.manifest.json')).json();
const c = arenaClassesFor(manifest);
const v = (opts) => arenaClassesFor(manifest, opts);

const DAYS = [
  { weekday: 'Mon', number: '13', today: false },
  { weekday: 'Tue', number: '14', today: true },
  { weekday: 'Wed', number: '15', today: false },
];
const HOURS = ['09:00', '10:00', '11:00'];
const TRACKS = 'repeat(3, minmax(0, 1fr))';
const HOUR_H = 44;

const CHIPS = [
  { title: 'Standup', time: '09:00 – 09:30', slot: 1, top: 0, height: 22, day: 0, col: 0, cols: 1 },
  { title: 'Design review', time: '09:00 – 11:00', slot: 3, top: 0, height: 88, day: 1, col: 0, cols: 2 },
  { title: 'Vendor sync', time: '09:30 – 10:30', slot: 5, top: 22, height: 44, day: 1, col: 1, cols: 2 },
  { title: 'Retro', time: '10:00 – 11:00', slot: 2, top: 44, height: 44, day: 2, col: 0, cols: 1 },
];

const paint = (slot) => ({
  background: `color-mix(in oklab, var(--color-cat-${slot}) 16%, var(--surface-card))`,
  borderLeftColor: `var(--color-cat-${slot})`,
});

const across = (day, col, cols) => {
  const left = ((day + col / cols) / DAYS.length) * 100;
  const share = (1 / (cols * DAYS.length)) * 100;
  return { left: `${left.toFixed(4)}%`, right: `${(100 - left - share).toFixed(4)}%` };
};

function chip(spec, showTime) {
  const node = el('div', {
    class: v({ clickable: true }).chip,
    style: { top: `${spec.top}px`, height: `${spec.height}px`, ...across(spec.day, spec.col, spec.cols), ...paint(spec.slot) },
  }, el('span', { class: c.title, text: spec.title }));
  if (showTime) node.append(el('span', { class: c.time, text: spec.time }));
  return node;
}

function grid() {
  const head = el('div', { class: c.headStrip, style: { gridTemplateColumns: TRACKS } });
  for (const day of DAYS) {
    head.append(el('div', { class: c.dayHead },
      el('div', { class: c.weekday, text: day.weekday }),
      el('div', { class: v({ today: day.today }).dayNumber, text: day.number })));
  }

  const gutter = el('div', { class: c.gutter });
  for (const [index, label] of HOURS.entries()) {
    gutter.append(el('div', { class: c.hourLabel, style: { top: `${index * HOUR_H}px` }, text: label }));
  }

  const plot = el('div', { class: c.grid, style: { gridTemplateColumns: TRACKS } });
  for (const index of HOURS.keys()) {
    plot.append(el('div', { class: c.rule, style: { top: `${index * HOUR_H}px` }, 'aria-hidden': 'true' }));
  }
  for (const index of DAYS.keys()) {
    const column = el('div', { class: v({ firstColumn: index === 0 }).column });
    for (const hour of HOURS.keys()) {
      column.append(el('div', { class: c.cell, style: { top: `${hour * HOUR_H}px`, height: `${HOUR_H}px` } }));
    }
    plot.append(column);
  }
  for (const spec of CHIPS) plot.append(chip(spec, spec.height >= 32));
  plot.append(el('div', { class: c.now, style: { top: '66px' } },
    el('span', { class: c.nowDot })));

  const body = el('div', { class: c.body, style: { height: `${HOURS.length * HOUR_H}px` } }, gutter, plot);
  return el('div', { class: c.root, style: { width: '820px' } },
    head, el('div', { class: c.scroll }, body));
}

function states() {
  const stage = el('div', { style: { position: 'relative', width: '820px', height: '76px' } });

  const plain = el('div', {
    class: v({ clickable: true }).chip,
    style: { top: '0px', height: '68px', left: '0%', right: '70%', ...paint(4) },
  }, el('span', { class: c.title, text: 'Inert chip' }), el('span', { class: c.time, text: '09:00 – 10:30' }));

  const reserved = el('div', {
    class: v({ clickable: true, reserve: true }).chip,
    style: { top: '0px', height: '68px', left: '33%', right: '37%', ...paint(6) },
  },
    el('span', { class: c.title, text: 'Kebab beside the title' }),
    el('span', { class: c.time, text: '09:00 – 10:30' }),
    el('span', { class: v({ actionsBelow: false }).kebabWrap },
      el('i', { class: 'ph-bold ph-dots-three-vertical', style: { fontSize: 'var(--icon-md)', color: 'var(--mute)' } })));

  const opened = el('div', {
    class: v({ clickable: true, reserve: true, panelOpen: true }).chip,
    style: { top: '0px', height: '68px', left: '66%', right: '4%', ...paint(8) },
  },
    el('span', { class: c.title, text: 'Panel open' }),
    el('span', { class: c.time, text: '09:00 – 10:30' }),
    el('span', { class: v({ actionsBelow: false }).kebabWrap },
      el('i', { class: 'ph-bold ph-dots-three-vertical', style: { fontSize: 'var(--icon-md)', color: 'var(--mute)' } }),
      el('span', { class: c.panel, style: { zIndex: 1 } },
        el('span', { class: c.time, text: 'Edit' }),
        el('span', { class: c.time, text: 'Cancel' }))));

  stage.append(plain, reserved, opened);
  return stage;
}

function toolbar() {
  return el('div', { class: c.toolbar, style: { width: '820px' } },
    el('button', { class: c.nav, type: 'button', 'aria-label': 'Previous' },
      el('i', { class: 'ph-bold ph-caret-left' })),
    el('button', { class: c.today, type: 'button', text: 'Today' }),
    el('button', { class: c.nav, type: 'button', 'aria-label': 'Next' },
      el('i', { class: 'ph-bold ph-caret-right' })),
    el('div', { class: c.heading, text: '13 – 15 Jul 2026' }),
    el('div', { class: c.actions }, el('button', { class: c.today, type: 'button', text: 'New event' })));
}

mountSpecimen({ sections: [
  section('Toolbar', [toolbar()], { stack: true }),
  section('Week grid — three days, three hours. Chip positions are hand-placed here; the component derives them from event times', [grid()], { stack: true }),
  section('Chip — inert, kebab reserved beside the title, and panel open', [states()], { stack: true }),
]});
</script></body></html>
