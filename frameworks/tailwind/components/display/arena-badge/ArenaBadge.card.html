<!-- @dsCard group="Tailwind" viewport="760x160" name="ArenaBadge" subtitle="Seven tones, rendered from ArenaBadge.manifest.json" -->
<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../../../../intro/styles.css">
<link rel="stylesheet" href="../../../consume/Preflight.generated.css">
<link rel="stylesheet" href="../../../consume/components/display/arena-badge/ArenaBadge.styles.generated.css">
<link rel="stylesheet" href="../../../Specimen.css">
</head><body><div id="root"></div>
<script type="module">
import { mountSpecimen, section, el, arenaClassesFor, arenaSlotDataFor } from '../../../Specimen.js';

const manifest = await (await fetch('./ArenaBadge.manifest.json')).json();
const TONES = ['neutral', 'accent', 'gold', 'success', 'warning', 'danger', 'info'];

function badge(tone, label, dot = false) {
  const c = arenaClassesFor(manifest, { tone });
  const d = arenaSlotDataFor(manifest, { tone });
  const node = el('span', { class: c.root, ...d.root });
  if (dot) node.append(el('span', { class: c.dot, ...d.dot }));
  node.append(label);
  return node;
}

mountSpecimen({ sections: [
  section('Tones', TONES.map((tone) => badge(tone, tone))),
  section('With a status dot', [
    badge('success', 'Live', true),
    badge('warning', 'Degraded', true),
    badge('danger', 'Down', true),
  ]),
]});
</script></body></html>
