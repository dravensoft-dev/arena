<!-- @dsCard group="Tailwind" viewport="700x263" name="ArenaSkeleton" subtitle="Loading placeholders, rendered from ArenaSkeleton.manifest.json" -->
<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../../../../intro/styles.css">
<link rel="stylesheet" href="../../../consume/Preflight.generated.css">
<link rel="stylesheet" href="../../../consume/components/display/arena-skeleton/ArenaSkeleton.styles.generated.css">
<link rel="stylesheet" href="../../../Specimen.css">
</head><body><div id="root"></div>
<script type="module">
import { mountSpecimen, section, el, arenaClassesFor, arenaSlotDataFor } from '../../../Specimen.js';

const manifest = await (await fetch('./ArenaSkeleton.manifest.json')).json();

function single(variant) {
  const c = arenaClassesFor(manifest, { variant });
  const d = arenaSlotDataFor(manifest, { variant });
  const box = el('div', { class: c.root, ...d.root });
  box.style.width = variant === 'circle' ? '' : '160px';
  return box;
}

function stacked(lines) {
  const c = arenaClassesFor(manifest, { variant: 'text' });
  const d = arenaSlotDataFor(manifest, { variant: 'text' });
  const closing = arenaClassesFor(manifest, { variant: 'text', last: true });
  const dClosing = arenaSlotDataFor(manifest, { variant: 'text', last: true });
  const stack = el('div', { class: c.stack, ...d.stack });
  stack.style.width = '220px';
  for (let i = 1; i <= lines; i++) stack.append(el('div', { class: (i === lines ? closing : c).line, ...(i === lines ? dClosing : d).line }));
  return stack;
}

mountSpecimen({ sections: [
  section('Single shapes', ['line', 'block', 'circle'].map(single)),
  section('Text, three lines', [stacked(3)]),
]});
</script></body></html>
