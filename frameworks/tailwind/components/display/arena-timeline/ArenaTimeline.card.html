<!-- @dsCard group="Tailwind" viewport="760x700" name="ArenaTimeline" subtitle="Every tone in every state, down and across, rendered from ArenaTimeline.manifest.json" -->
<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../../../../intro/styles.css">
<link rel="stylesheet" href="../../../consume/Preflight.generated.css">
<link rel="stylesheet" href="../../../consume/components/display/arena-timeline/ArenaTimeline.styles.generated.css">
<link rel="stylesheet" href="../../../consume/hues/display/arena-timeline/ArenaTimeline.hues.generated.css">
<link rel="stylesheet" href="../../../consume/vocabulary/Orientation.generated.css">
<link rel="stylesheet" href="../../../Specimen.css">
</head><body><div id="root"></div>
<script type="module">
import { mountSpecimen, section, el, arenaClassesFor, arenaSlotDataFor, glyph } from '../../../Specimen.js';

const manifest = await (await fetch('./ArenaTimeline.manifest.json')).json();
const GLYPH = { success: 'ph-check-circle', warning: 'ph-warning', danger: 'ph-warning-octagon', info: 'ph-info' };
const WORD = { current: 'Current', upcoming: 'Upcoming' };

function timeline(items, index, orientation = 'vertical') {
  const root = el('ol', { class: `${arenaClassesFor(manifest).root} arena-orientation-${orientation}`, ...arenaSlotDataFor(manifest).root, role: 'list', 'aria-label': 'Order 4821' });
  root.style.width = orientation === 'vertical' ? '340px' : '680px';
  items.forEach(([title, time, tone = 'neutral'], i) => {
    const state = index === undefined || i < index ? 'complete' : i === index ? 'current' : 'upcoming';
    const c = arenaClassesFor(manifest, { state, tone });
    const d = arenaSlotDataFor(manifest, { state, tone });
    const item = el('li', { class: c.item, ...d.item });
    if (state === 'current') item.setAttribute('aria-current', 'step');
    const rail = el('span', { class: c.rail, ...d.rail, 'aria-hidden': 'true' });
    const dot = el('span', { class: c.dot, ...d.dot });
    if (GLYPH[tone]) dot.append(glyph(`${c.icon} ph-fill ${GLYPH[tone]}`, { ...d.icon }));
    rail.append(dot);
    if (i < items.length - 1) rail.append(el('span', { class: c.connector, ...d.connector }));
    const content = el('div', { class: c.content, ...d.content });
    if (WORD[state]) content.append(el('span', { class: c.name, ...d.name, text: WORD[state] }));
    content.append(el('span', { class: c.title, ...d.title, text: title }));
    if (time) content.append(el('span', { class: c.time, ...d.time, text: time }));
    item.append(rail, content);
    root.append(item);
  });
  return root;
}

const TONES = [['Order placed', 'Mar 3'], ['Payment captured', 'Mar 3', 'success'], ['Held at customs', 'Mar 5', 'warning'], ['In transit', 'Mar 8', 'info'], ['Delivery', null, 'danger']];

mountSpecimen({ sections: [
  section('Down, in motion: complete, current and upcoming', [timeline(TONES, 2)], { stack: true }),
  section('A history: every milestone complete', [timeline(TONES)], { stack: true }),
  section('Across, in equal columns', [timeline(TONES, 3, 'horizontal')], { stack: true }),
]});
</script></body></html>
