<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../../../../intro/styles.css">
<link rel="stylesheet" href="../../../consume/Preflight.generated.css">
<link rel="stylesheet" href="../../../consume/components/display/arena-tag/ArenaTag.styles.generated.css">
<link rel="stylesheet" href="../../../Specimen.css">
</head><body><div id="root"></div>
<script type="module">
import { mountSpecimen, section, el, arenaClassesFor, arenaSlotDataFor } from '../../../Specimen.js';

const manifest = await (await fetch('./ArenaTag.manifest.json')).json();

function tag(tone, label) {
  const c = arenaClassesFor(manifest, { tone });
  const d = arenaSlotDataFor(manifest, { tone });
  return el('span', { class: c.root, ...d.root }, el('span', { class: c.dot, ...d.dot }), label);
}

mountSpecimen({ sections: [
  section('Tones', [
    tag('neutral', 'Draft'), tag('primary', 'Active'), tag('success', 'Live'),
    tag('warning', 'Degraded'), tag('danger', 'Blocked'),
  ]),
]});
</script></body></html>
