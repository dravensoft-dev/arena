<!-- @dsCard group="Tailwind" viewport="640x735" name="ArenaUnauthCard" subtitle="The signed-out frame, rendered from ArenaUnauthCard.manifest.json" -->
<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../../../../intro/styles.css">
<link rel="stylesheet" href="../../../consume/Preflight.generated.css">
<link rel="stylesheet" href="../../../consume/components/brand/arena-app-logo/ArenaAppLogo.styles.generated.css">
<link rel="stylesheet" href="../../../consume/components/display/arena-unauth-card/ArenaUnauthCard.styles.generated.css">
<link rel="stylesheet" href="../../../Specimen.css">
</head><body><div id="root"></div>
<script type="module">
import { mountSpecimen, section, el, arenaClassesFor, arenaSlotDataFor } from '../../../Specimen.js';

const manifest = await (await fetch('./ArenaUnauthCard.manifest.json')).json();
const logo = await (await fetch('../../brand/arena-app-logo/ArenaAppLogo.manifest.json')).json();

function panel({ eyebrow, title, body, footer }) {
  const c = arenaClassesFor(manifest);
  const d = arenaSlotDataFor(manifest);
  const l = arenaClassesFor(logo, { size: 'md' });
  const dL = arenaSlotDataFor(logo, { size: 'md' });
  return el('div', { class: c.root, ...d.root },
    el('div', { class: c.panel, ...d.panel },
      el('div', { class: c.body, ...d.body },
        el('div', { class: c.brand, ...d.brand },
          el('span', { class: l.root, ...dL.root },
            el('span', { class: l.mark, ...dL.mark }, el('img', { src: '../../../../../assets/rotor-crimson.svg', alt: '' })),
            el('span', { class: l.name, ...dL.name }, 'Draven', el('span', { class: l.dim, ...dL.dim, text: 'soft' })))),
        el('div', { class: c.eyebrow, ...d.eyebrow, text: eyebrow }),
        el('div', { class: c.title, ...d.title, text: title }),
        el('div', { class: 'font-body text-md text-base-content/82', text: body }),
        el('div', { class: c.footer, ...d.footer, text: footer }))));
}

mountSpecimen({ sections: [
  section('Sign in', [panel({
    eyebrow: 'Delivery Console', title: 'Sign in',
    body: 'Form controls compose inside the frame; the component holds none of them.',
    footer: 'Trouble signing in? Contact your administrator.',
  })], { justify: 'center' }),
  section('Check your inbox — the same frame', [panel({
    eyebrow: 'Delivery Console', title: 'Check your inbox',
    body: 'We sent a sign-in link to your work address. It expires in 15 minutes.',
    footer: 'Wrong address? Start again.',
  })], { justify: 'center' }),
]});
</script></body></html>
