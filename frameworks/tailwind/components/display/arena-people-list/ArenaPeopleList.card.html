<!-- @dsCard group="Tailwind" viewport="640x260" name="ArenaPeopleList" subtitle="The three sizes and the reader's own row, rendered from ArenaPeopleList.manifest.json" -->
<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../../../../intro/styles.css">
<link rel="stylesheet" href="../../../consume/Preflight.generated.css">
<link rel="stylesheet" href="../../../consume/components/display/arena-people-list/ArenaPeopleList.styles.generated.css">
<link rel="stylesheet" href="../../../consume/components/display/arena-avatar/ArenaAvatar.styles.generated.css">
<link rel="stylesheet" href="../../../consume/vocabulary/Size.generated.css">
<link rel="stylesheet" href="../../../Specimen.css">
</head><body><div id="root"></div>
<script type="module">
import { mountSpecimen, section, el, arenaClassesFor, arenaSlotDataFor } from '../../../Specimen.js';

const manifest = await (await fetch('./ArenaPeopleList.manifest.json')).json();
const avatar = await (await fetch('../arena-avatar/ArenaAvatar.manifest.json')).json();

function face(name) {
  const a = arenaClassesFor(avatar);
  const dA = arenaSlotDataFor(avatar);
  const initials = name.split(' ').slice(0, 2).map((word) => word[0]).join('').toUpperCase();
  return el('span', { class: a.root, ...dA.root, style: '--arena-size-avatar: var(--arena-size-face, var(--size-md-face))' }, el('span', { class: a.box, ...dA.box }, initials));
}

function row(current, rank, name, secondary, figure) {
  const c = arenaClassesFor(manifest, { current });
  const d = arenaSlotDataFor(manifest, { current });
  return el('li', { class: c.row, ...d.row },
    el('span', { class: c.rank, ...d.rank }, String(rank)),
    face(name),
    el('span', { class: c.text, ...d.text },
      el('span', { class: c.name, ...d.name }, name),
      el('span', { class: c.secondary, ...d.secondary }, secondary)),
    el('span', { class: c.figure, ...d.figure }, figure));
}

function list(size) {
  const c = arenaClassesFor(manifest);
  const d = arenaSlotDataFor(manifest);
  return el('ol', { class: `${c.root} arena-size-${size}`, ...d.root },
    row(false, 1, 'Ines Marchetti', 'Promoted last week', '2480 XP'),
    row(true, 2, 'Kofi Mensah', 'You', '2210 XP'));
}

mountSpecimen({ sections: [
  section('Small', [list('sm')]),
  section('Medium', [list('md')]),
  section('Large', [list('lg')]),
]});
</script></body></html>
