<!-- @dsCard group="Tailwind" viewport="700x136" name="ArenaTooltip" subtitle="The inverted overlay, rendered from ArenaTooltip.manifest.json" -->
<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../../../../intro/styles.css">
<link rel="stylesheet" href="../../../consume/Preflight.generated.css">
<link rel="stylesheet" href="../../../consume/components/feedback/arena-tooltip/ArenaTooltip.styles.generated.css">
<link rel="stylesheet" href="../../../Specimen.css">
</head><body><div id="root"></div>
<script type="module">
import { mountSpecimen, section, el, arenaClassesFor } from '../../../Specimen.js';

const manifest = await (await fetch('./ArenaTooltip.manifest.json')).json();
const c = arenaClassesFor(manifest);

/* A component places its bubble by script, over its trigger; the specimen places it the same
   way with its own styles, so a screenshot shows where a reader sees it. */
function tooltip(label, content) {
  const bubble = el('span', { class: c.bubble, role: 'tooltip', text: content });
  bubble.style.position = 'absolute';
  bubble.style.bottom = 'calc(100% + var(--sp-2))';
  bubble.style.left = '50%';
  bubble.style.transform = 'translateX(-50%)';
  const root = el('span', { class: c.root },
    el('span', { class: 'font-body text-ctl text-base-content/82', text: label }), bubble);
  root.style.position = 'relative';
  root.style.marginTop = 'var(--sp-8)';
  return root;
}

mountSpecimen({ sections: [
  section('Always shown here — in use it appears on hover', [
    tooltip('Deployments', 'Everything shipped in the last 30 days'),
    tooltip('p95', '95th percentile response time'),
  ]),
]});
</script></body></html>
