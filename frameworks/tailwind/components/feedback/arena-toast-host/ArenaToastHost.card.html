<!-- @dsCard group="Tailwind" viewport="820x440" name="ArenaToastHost" subtitle="The four placements, live and pinned, rendered from ArenaToastHost.manifest.json" -->
<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../../../../intro/styles.css">
<link rel="stylesheet" href="../../../consume/Preflight.generated.css">
<link rel="stylesheet" href="../../../consume/components/feedback/arena-toast/ArenaToast.styles.generated.css">
<link rel="stylesheet" href="../../../consume/components/feedback/arena-toast-host/ArenaToastHost.styles.generated.css">
<link rel="stylesheet" href="../../../Specimen.css">
</head><body><div id="root"></div>
<script type="module">
import { mountSpecimen, section, el, arenaClassesFor, arenaSlotDataFor } from '../../../Specimen.js';

const hostManifest = await (await fetch('./ArenaToastHost.manifest.json')).json();
const toastManifest = await (await fetch('../arena-toast/ArenaToast.manifest.json')).json();

function toast({ tone = 'neutral', title, message }) {
  const c = arenaClassesFor(toastManifest, { tone });
  const d = arenaSlotDataFor(toastManifest, { tone });
  return el('div', {
    class: c.root, ...d.root, role: tone === 'danger' ? 'alert' : 'status',
    'aria-live': tone === 'danger' ? 'assertive' : 'polite',
  }, el('div', { class: c.body, ...d.body },
    el('div', { class: c.title, ...d.title }, title),
    el('div', { class: c.message, ...d.message, text: message })));
}

function host(placement, notice) {
  return el('div', { class: arenaClassesFor(hostManifest, { placement }).root, ...arenaSlotDataFor(hostManifest, { placement }).root }, toast(notice));
}

const corners = [
  ['top-start', { title: 'top-start', message: 'Pinned to the block start and the inline start.' }],
  ['top-end', { tone: 'success', title: 'top-end', message: 'Both stacks clear the notch by --pad-safe-top.' }],
  ['bottom-start', { tone: 'gold', title: 'bottom-start', message: 'The inline half flips with the document.' }],
  ['bottom-end', { tone: 'danger', title: 'bottom-end', message: 'The default. Clears --pad-safe-bottom.' }],
];

mountSpecimen({ sections: [
  section('Four placements, each pinned to the viewport itself', [
    el('div', { class: 'font-body text-sm text-base-content/62' },
      'The box is fixed, so it is measured against the viewport and not against this page. '
      + 'It carries no role and no live region: each notice announces for itself.'),
  ]),
]});

for (const [placement, notice] of corners) document.body.append(host(placement, notice));
</script></body></html>
