<!-- @dsCard group="Tailwind" viewport="760x287" name="ArenaProgressBar" subtitle="Determinate and indeterminate, rendered from ArenaProgressBar.manifest.json" -->
<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../../../../intro/styles.css">
<link rel="stylesheet" href="../../../consume/Preflight.generated.css">
<link rel="stylesheet" href="../../../consume/components/feedback/arena-progress-bar/ArenaProgressBar.styles.generated.css">
<link rel="stylesheet" href="../../../Specimen.css">
</head><body><div id="root"></div>
<script type="module">
import { mountSpecimen, section, el, arenaClassesFor, arenaSlotDataFor } from '../../../Specimen.js';

const manifest = await (await fetch('./ArenaProgressBar.manifest.json')).json();

function bar({ label, value, tone = 'accent', size = 'md', indeterminate = false }) {
  const c = arenaClassesFor(manifest, { tone, size, indeterminate });
  const d = arenaSlotDataFor(manifest, { tone, size, indeterminate });
  const root = el('div', { class: c.root, ...d.root });
  root.style.width = '260px';
  if (label) {
    const head = el('div', { class: c.head, ...d.head }, el('span', { class: c.label, ...d.label, text: label }));
    if (!indeterminate) head.append(el('span', { class: c.value, ...d.value, text: `${value}%` }));
    root.append(head);
  }
  const track = el('div', {
    class: c.track, ...d.track, role: 'progressbar',
    'aria-valuenow': indeterminate ? undefined : value, 'aria-valuemin': 0, 'aria-valuemax': 100,
    'aria-label': label ?? 'Progress',
  });
  if (!indeterminate) {
    const fill = el('span', { class: c.fill, ...d.fill });
    fill.style.width = `${value}%`;
    track.append(fill);
  }
  root.append(track);
  return root;
}

mountSpecimen({ sections: [
  section('Determinate — prefer this whenever the percentage is knowable', [
    bar({ label: 'Uploading artifacts', value: 42 }),
    bar({ label: 'Migrating rows', value: 88, tone: 'success' }),
    bar({ label: 'Retrying', value: 15, tone: 'danger' }),
  ]),
  section('Sizes', [bar({ value: 60, size: 'sm' }), bar({ value: 60 }), bar({ value: 60, size: 'lg' })]),
  section('Indeterminate — only when there is no percentage to report', [
    bar({ label: 'Waiting for the runner', indeterminate: true }),
  ]),
]});
</script></body></html>
