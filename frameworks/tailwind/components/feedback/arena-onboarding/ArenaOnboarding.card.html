<!-- @dsCard group="Tailwind" viewport="760x549" name="ArenaOnboarding" subtitle="Coachmark and progress, rendered from ArenaOnboarding.manifest.json" -->
<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../../../../intro/styles.css">
<link rel="stylesheet" href="../../../consume/Preflight.generated.css">
<link rel="stylesheet" href="../../../consume/components/feedback/arena-onboarding/ArenaOnboarding.styles.generated.css">
<link rel="stylesheet" href="../../../Specimen.css">
<style>.static-panel{position:static!important}</style>
</head><body><div id="root"></div>
<script type="module">
import { mountSpecimen, section, el, arenaClassesFor, arenaSlotDataFor } from '../../../Specimen.js';

const manifest = await (await fetch('./ArenaOnboarding.manifest.json')).json();

/* `panel` is `fixed`, which a specimen showing two states side by side cannot use --
   `.static-panel` unpins it here and changes nothing else. The third section renders
   `root` for real (open: true, un-pinned panel included), so the scrim and the open
   variant this whole primitive host-binds are actually visible somewhere in the only
   visual artifact of this component -- the same reason ArenaConfirmDialog.card.html's own
   third section exists. */
function coachmark({ eyebrow, title, body, index, total }) {
  const c = arenaClassesFor(manifest, { placement: 'floating' });
  const d = arenaSlotDataFor(manifest, { placement: 'floating' });
  const current = arenaClassesFor(manifest, { placement: 'floating', current: true });
  const dCurrent = arenaSlotDataFor(manifest, { placement: 'floating', current: true });
  const dots = el('div', { class: c.dots, ...d.dots });
  for (let i = 0; i < total; i++) dots.append(el('span', { class: (i === index ? current : c).dot, ...(i === index ? dCurrent : d).dot }));
  const foot = el('div', { class: c.foot, ...d.foot }, dots);
  if (index > 0) foot.append(el('button', { class: c.text, ...d.text, type: 'button', text: 'Back' }));
  if (index < total - 1) foot.append(el('button', { class: c.text, ...d.text, type: 'button', text: 'Skip' }));
  foot.append(el('button', { class: c.next, ...d.next, type: 'button', text: index === total - 1 ? 'Got it' : 'Next' }));
  return el('div', { class: `${c.panel} static-panel`, ...d.panel },
    el('div', { class: c.eyebrow, ...d.eyebrow, text: eyebrow }),
    el('div', { class: c.title, ...d.title, text: title }),
    el('div', { class: c.body, ...d.body, text: body }),
    foot);
}

function overlay() {
  const c = arenaClassesFor(manifest, { open: 'true', placement: 'floating' });
  const d = arenaSlotDataFor(manifest, { open: 'true', placement: 'floating' });
  const current = arenaClassesFor(manifest, { open: 'true', placement: 'floating', current: true });
  const dCurrent = arenaSlotDataFor(manifest, { open: 'true', placement: 'floating', current: true });
  const dots = el('div', { class: c.dots, ...d.dots });
  for (let i = 0; i < 3; i++) dots.append(el('span', { class: (i === 0 ? current : c).dot, ...(i === 0 ? dCurrent : d).dot }));
  const foot = el('div', { class: c.foot, ...d.foot }, dots,
    el('button', { class: c.text, ...d.text, type: 'button', text: 'Skip' }),
    el('button', { class: c.next, ...d.next, type: 'button', text: 'Next' }));
  const panel = el('div', { class: c.panel, ...d.panel },
    el('div', { class: c.eyebrow, ...d.eyebrow, text: 'Getting started' }),
    el('div', { class: c.title, ...d.title, text: 'Cmd+K runs anything' }),
    el('div', { class: c.body, ...d.body, text: 'The command palette reaches every action without leaving the keyboard.' }),
    foot);
  return el('div', { class: c.root, ...d.root }, panel);
}

mountSpecimen({ sections: [
  section('First step', [coachmark({ eyebrow: 'Getting started', title: 'This is the delivery board', body: 'Every project your team is shipping, grouped by client.', index: 0, total: 3 })]),
  section('Last step', [coachmark({ eyebrow: 'Getting started', title: 'Press Cmd+K anywhere', body: 'The command palette runs any action without leaving the keyboard.', index: 2, total: 3 })]),
  section('The root slot: the fixed scrim, open', [overlay()]),
]});
</script></body></html>
