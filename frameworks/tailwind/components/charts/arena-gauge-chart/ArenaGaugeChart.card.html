<!-- @dsCard group="Tailwind" viewport="700x260" name="ArenaGaugeChart" subtitle="The frame of the gauge, rendered from ArenaGaugeChart.manifest.json" -->
<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../../../../intro/styles.css">
<link rel="stylesheet" href="../../../consume/Preflight.generated.css">
<link rel="stylesheet" href="../../../consume/components/charts/arena-gauge-chart/ArenaGaugeChart.styles.generated.css">
<link rel="stylesheet" href="../../../Specimen.css">
</head><body><div id="root"></div>
<script type="module">
import { mountSpecimen, section, el, arenaClassesFor } from '../../../Specimen.js';

const manifest = await (await fetch('./ArenaGaugeChart.manifest.json')).json();
const c = arenaClassesFor(manifest);

/* The dial is hand drawn and is not rendered here; the placeholder stands where it goes. */
function plot() {
  const frame = el('div', { class: `${c.frame} bg-base-300 rounded-sm` });
  frame.style.height = '200px';
  return frame;
}

mountSpecimen({ sections: [
  section('Frame', [el('div', { class: 'flex flex-col gap-4', style: 'width:280px' }, plot())], { align: 'start' }),
]});
</script></body></html>
