<!-- @dsCard group="Tailwind" viewport="700x300" name="ArenaFunnelChart" subtitle="The frame and tooltip of the chart, rendered from ArenaFunnelChart.manifest.json" -->
<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../../../../intro/styles.css">
<link rel="stylesheet" href="../../../consume/Preflight.generated.css">
<link rel="stylesheet" href="../../../consume/components/charts/arena-funnel-chart/ArenaFunnelChart.styles.generated.css">
<link rel="stylesheet" href="../../../Specimen.css">
</head><body><div id="root"></div>
<script type="module">
import { mountSpecimen, section, el, arenaClassesFor } from '../../../Specimen.js';

const manifest = await (await fetch('./ArenaFunnelChart.manifest.json')).json();
const c = arenaClassesFor(manifest);

/* The plot is hand drawn and is not rendered here; the placeholder stands where it goes. */
function plot() {
  const frame = el('div', { class: `${c.frame} bg-base-300 rounded-sm` });
  frame.style.height = '120px';
  const tip = el('div', { class: c.tooltip }, el('div', { class: c.tooltipLabel, text: 'Sign-ups' }), el('div', { class: c.tooltipValue, text: '3,120' }));
  tip.style.left = '50%';
  tip.style.top = '60%';
  frame.append(tip);
  return frame;
}

mountSpecimen({ sections: [
  section('Frame and tooltip', [el('div', { class: 'flex flex-col gap-4', style: 'width:320px' }, plot())], { align: 'start' }),
]});
</script></body></html>
