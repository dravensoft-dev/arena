<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../../../../intro/styles.css">
<link rel="stylesheet" href="../../../consume/Preflight.generated.css">
<link rel="stylesheet" href="../../../consume/components/brand/arena-app-logo/ArenaAppLogo.styles.generated.css">
<link rel="stylesheet" href="../../../Specimen.css">
</head><body><div id="root"></div>
<script type="module">
import { mountSpecimen, section, el, arenaClassesFor, arenaSlotDataFor } from '../../../Specimen.js';

const manifest = await (await fetch('./ArenaAppLogo.manifest.json')).json();

function logo(size, orientation = 'horizontal') {
  const c = arenaClassesFor(manifest, { size, orientation });
  const d = arenaSlotDataFor(manifest, { size, orientation });
  return el('span', { class: c.root, ...d.root },
    el('span', { class: c.mark, ...d.mark }, el('img', { src: '../../../../../assets/rotor-crimson.svg', alt: '' })),
    el('span', { class: c.name, ...d.name }, 'Draven', el('span', { class: c.dim, ...d.dim, text: 'soft' })));
}

mountSpecimen({ sections: [
  section('Horizontal — sm, md, lg', [logo('sm'), logo('md'), logo('lg')], { gap: 'loose' }),
  section('Horizontal — xl', [logo('xl')]),
  section('Vertical', [logo('md', 'vertical'), logo('lg', 'vertical')], { gap: 'loose' }),
]});
</script></body></html>
